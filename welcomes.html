<!DOCTYPE html>
<html>
<head>
<title>Welcome</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

height:100vh;

display:flex;

justify-content:center;

align-items:center;

background:linear-gradient(135deg,#4F46E5,#06B6D4,#22C55E);

}

.container{

background:white;

padding:50px;

width:600px;

border-radius:25px;

text-align:center;

box-shadow:0 10px 30px rgba(0,0,0,.3);

}

img{

width:170px;

height:170px;

border-radius:50%;

border:6px solid #2563EB;

margin-bottom:20px;

}

h1{

color:#1E3A8A;

font-size:40px;

margin-bottom:10px;

}

h2{

color:#059669;

margin-bottom:20px;

}

p{

font-size:18px;

color:#555;

line-height:30px;

}

a{

display:inline-block;

margin-top:35px;

padding:15px 40px;

background:linear-gradient(90deg,#2563EB,#7C3AED);

color:white;

text-decoration:none;

font-size:20px;

border-radius:40px;

transition:.3s;

}

a:hover{

background:linear-gradient(90deg,#06B6D4,#22C55E);

transform:scale(1.08);

}

</style>

</head>

<body>

<div class="container">

<img src="students.jpg">

<h1>Welcome</h1>

<h2>Student Portfolio</h2>

<p>

Hello! I'm <b>JEFI S</b>.

<br><br>

Artificial Intelligence & Data Science Student

<br><br>

Explore my profile, education, skills, gallery and contact information.

</p>

<a href="index.html">🚀 Enter Portfolio</a>

</div>

</body>
</html>
