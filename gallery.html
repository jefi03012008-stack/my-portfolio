<!DOCTYPE html>
<html>
<head>
    <title>Gallery</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .gallery{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
            gap:25px;
            margin-top:25px;
        }

        .gallery-card{
            background:white;
            border-radius:15px;
            overflow:hidden;
            box-shadow:0 6px 15px rgba(0,0,0,0.15);
            transition:.3s;
            text-align:center;
        }

        .gallery-card:hover{
            transform:translateY(-8px);
        }

        .gallery-card img{
            width:100%;
            height:180px;
            object-fit:cover;
        }

        .gallery-card h3{
            color:#2563eb;
            padding:15px;
        }
    </style>

</head>

<body>

<div class="sidebar">

    <a href="skills.html">💻 Skills</a>
    <a href="gallery.html" class="active">🖼 Gallery</a>
    <a href="contact.html">📞 Contact</a>

</div>

<div class="main">

<h1>🖼 My Gallery</h1>
<p>Photos & Certificates</p>
</div>

<div class="gallery">

<div class="gallery-card">
<img src="students.jpg">
<h3>My Photo</h3>
</div>

<div class="gallery-card">
<img src="school.jpg">
<h3>School</h3>
</div>

<div class="gallery-card">
<img src="college.jpg">
<h3>College</h3>
</div>

<div class="gallery-card">

</div>

<div class="gallery-card">

</div>

</div>

</body>
</html>
